<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حجوزات الأطباء - معاملاتي</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/notifications.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body class="royal-dark">

    <nav class="glass-nav">
        <a href="dashboard.html" class="logo-container">
            <div class="logo-box">
                <img src="assets/logo.png" alt="Moamalaty">
            </div>
            <div>
                <div style="font-weight: 950; font-size: 20px; color: white;">الأطباء <span
                        style="font-size: 12px; color: var(--gold);">Moamalaty Doctors</span></div>
                <div style="font-size: 8px; color: var(--gold); font-weight: 800; letter-spacing: 1px;">ROYAL CLINIC
                </div>
            </div>
        </a>
        <div id="nav-right" style="display: flex; align-items: center; gap: 15px;">
            <button onclick="UIManager.toggleLanguage()" class="btn-icon">🌐</button>
            <button onclick="UIManager.toggleTheme()" class="btn-icon">🌗</button>
        </div>
    </nav>

    <div id="booking-modal"
        style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 2000; align-items: center; justify-content: center; backdrop-filter: blur(5px);">
        <div class="card" style="max-width: 400px; width: 90%; text-align: center;">
            <div id="modal-icon" style="font-size: 50px; margin-bottom: 20px;"></div>
            <h3 id="modal-title" style="font-weight: 900; margin-bottom: 15px;"></h3>
            <p id="modal-msg" style="color: #64748B; font-weight: 700; margin-bottom: 25px;"></p>
            <button onclick="closeModal()" class="btn btn-primary" style="width: 100%;">فهمت ذلك</button>
        </div>
    </div>

    <div class="container" style="padding-top: 20px;">
        <div class="text-center mb-2" style="margin-bottom: 40px;">
            <h1 style="font-weight: 950; font-size: 3rem; color: white;">دليل الأطباء المهني 🩺</h1>
            <p style="color: var(--text-muted); font-weight: 700; font-size: 1.15rem;">احجز استشارتك الآن بلمسة ملكية
                رقمية</p>
        </div>

        <div class="card" style="margin-bottom: 50px;">
            <div class="grid grid-3" style="gap: 20px;">
                <div>
                    <label
                        style="font-size: 0.8rem; font-weight: 800; color: var(--text-muted); margin-bottom: 8px; display: block;">اسم
                        الطبيب</label>
                    <input type="text" id="search-name" class="form-input" placeholder="مثال: د. أحمد"
                        oninput="filterDoctors()">
                </div>
                <div>
                    <label
                        style="font-size: 0.8rem; font-weight: 800; color: var(--text-muted); margin-bottom: 8px; display: block;">الاختصاص</label>
                    <input type="text" id="search-spec" class="form-input" placeholder="مثال: قلبية"
                        oninput="filterDoctors()">
                </div>
                <div>
                    <label
                        style="font-size: 0.8rem; font-weight: 800; color: var(--text-muted); margin-bottom: 8px; display: block;">المحافظة</label>
                    <select id="search-gov" class="form-input"
                        onchange="LocationHelper.updateCities(this.value, 'search-city'); filterDoctors();">
                        <option value="">كل المحافظات</option>
                    </select>
                </div>
            </div>
        </div>

        <div id="doctors-grid" class="grid grid-3">
            <!-- Dynamically Loaded from auth.js Store -->
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/syria-data.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/ui-manager.js"></script>
    <script>
        let allDoctors = [];

        async function loadApprovedPartners() {
            const partners = [];

            if (typeof FirebaseDB !== 'undefined' && FirebaseDB.partnerRequests && typeof FirebaseDB.partnerRequests.getAll === 'function') {
                try {
                    const res = await FirebaseDB.partnerRequests.getAll();
                    if (res.success && Array.isArray(res.data)) {
                        partners.push(...res.data.filter(p => p.status === 'APPROVED'));
                    }
                } catch (e) {
                    console.warn('Failed loading approved partner_requests from Firebase:', e);
                }
            }

            try {
                const localApps = JSON.parse(localStorage.getItem('wusul_applications') || '[]');
                if (Array.isArray(localApps)) {
                    partners.push(...localApps.filter(p => p.status === 'APPROVED'));
                }
            } catch (e) { }

            try {
                const localDbApps = JSON.parse(localStorage.getItem('wusul_db_applications') || '[]');
                if (Array.isArray(localDbApps)) {
                    partners.push(...localDbApps.filter(p => p.status === 'APPROVED'));
                }
            } catch (e) { }

            const cleaned = partners
                .map(p => ({
                    ...p,
                    type: p.type || p.role || 'PARTNER',
                    specialty: p.specialty || p.type || 'شريك معتمد',
                    displayPrice: p.displayPrice || p.price || 'حسب الخدمة',
                    avatar: p.avatar || `https://api.dicebear.com/7.x/avataaars/svg?seed=${encodeURIComponent(p.name || p.ref || p.id || 'partner')}`,
                    governorate: p.governorate || p.city || ''
                }))
                .filter((item, index, arr) => {
                    const key = item.phone || item.id || item.ref;
                    return key && arr.findIndex(x => (x.phone || x.id || x.ref) === key) === index;
                });

            try {
                const localDocs = JSON.parse(localStorage.getItem('wusul_db_doctors') || '[]');
                const existingKeys = new Set(localDocs.map(d => d.id || d.phone || d.ref));
                const toAdd = cleaned.filter(item => {
                    const key = item.id || item.phone || item.ref;
                    return key && !existingKeys.has(key);
                }).map(item => ({
                    id: item.id || item.phone || item.ref,
                    name: item.name || 'شريك',
                    specialty: item.specialty,
                    city: item.city || item.governorate || '',
                    displayPrice: item.displayPrice,
                    avatar: item.avatar,
                    isVerified: true,
                    type: item.type
                }));
                if (toAdd.length) {
                    localStorage.setItem('wusul_db_doctors', JSON.stringify([...localDocs, ...toAdd]));
                }
            } catch (e) {
                console.warn('Failed syncing approved partners into local doctors store:', e);
            }

            return cleaned;
        }

        document.addEventListener('DOMContentLoaded', async () => {
            LocationHelper.initGovernorates('search-gov');

            const doctors = await Store.getData('doctors') || [];
            const approvedDoctors = doctors.filter(d => d.isVerified || d.status === 'APPROVED' || d.role === 'DOCTOR');
            const partners = await loadApprovedPartners();

            const merged = [...approvedDoctors, ...partners];
            const unique = [];
            const seen = new Set();

            merged.forEach(item => {
                const key = item.id || item.phone || item.ref;
                if (!key || seen.has(key)) return;
                seen.add(key);
                unique.push(item);
            });

            allDoctors = unique;
            renderDoctors(allDoctors);
        });

        function renderDoctors(doctorsList) {
            const grid = document.getElementById('doctors-grid');
            if (doctorsList.length === 0) {
                grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: var(--text-muted); font-weight: 700;">لا يوجد أطباء مطابقين للبحث حالياً</div>`;
                return;
            }
            grid.innerHTML = '';
            doctorsList.forEach(dr => {
                const label = dr.type === 'DOCTOR' ? 'طبيب' : (dr.type === 'PARTNER' ? 'شريك' : dr.type || 'شريك');
                const specialty = dr.specialty || dr.type || 'شريك معتمد';
                const location = dr.city || dr.governorate || 'غير محدد';

                grid.innerHTML += `
                    <div class="card">
                        <div style="display: flex; align-items: center; gap: 20px; margin-bottom: 25px;">
                            <img src="${dr.avatar || 'assets/nuser.png'}" style="width: 75px; height: 75px; border-radius: 20px; border: 2px solid var(--border-rgba); background: rgba(255,255,255,0.05); object-fit: cover;">
                            <div>
                                <h3 style="font-weight: 950; font-size: 1.25rem; color: white;">${dr.name || 'مستخدم'}</h3>
                                <p style="color: var(--gold); font-weight: 900; font-size: 0.85rem;">${specialty}</p>
                                <p style="font-size: 0.75rem; color: var(--text-muted); font-weight: 700;">📍 ${location}</p>
                                <span style="display:inline-block;margin-top:6px;padding:6px 10px;border-radius:12px;background:rgba(255,255,255,0.05);font-size:0.75rem;color:var(--text-muted);">${label}</span>
                            </div>
                        </div>
                        <div style="background: rgba(197, 160, 33, 0.05); padding: 18px; border-radius: 20px; margin-bottom: 25px; border: 1px solid var(--border-rgba);">
                            <p style="font-size: 0.9rem; font-weight: 800; color: white; display: flex; justify-content: space-between;">
                                <span>تكلفة الكشف الملكي:</span>
                                <span style="color: var(--gold);">${dr.displayPrice || 'حسب الخدمة'}</span>
                            </p>
                        </div>
                        <a href="booking.html?id=${dr.id || dr.phone || dr.ref || ''}" class="btn btn-primary" style="width: 100%; border-radius: 20px; font-size:1rem;">حجز استشارة 🩺</a>
                    </div>
                `;
            });
        }

        function filterDoctors() {
            const nameQuery = document.getElementById('search-name').value.toLowerCase();
            const specQuery = document.getElementById('search-spec').value.toLowerCase();
            const govQuery = document.getElementById('search-gov').value;

            const filtered = allDoctors.filter(dr => {
                const matchName = (dr.name || '').toLowerCase().includes(nameQuery);
                const matchSpec = (dr.specialty || dr.type || '').toLowerCase().includes(specQuery);
                const locationValue = `${dr.governorate || ''}`.toLowerCase();
                const cityValue = `${dr.city || ''}`.toLowerCase();
                const matchGov = govQuery ? (locationValue === govQuery.toLowerCase() || cityValue === govQuery.toLowerCase()) : true;
                return matchName && matchSpec && matchGov;
            });

            renderDoctors(filtered);
        }

        function closeModal() {
            document.getElementById('booking-modal').style.display = 'none';
        }
    </script>
</body>

</html>
