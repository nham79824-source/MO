<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الإشعارات - معاملاتي</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/notifications.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
<style>
  .notif-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px;flex-wrap:wrap;gap:15px;}
  .notif-filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:25px;}
  .notif-filter-btn{padding:9px 18px;border-radius:50px;border:1px solid var(--border-rgba);background:rgba(255,255,255,.03);color:var(--text-muted);font-weight:800;font-size:.8rem;cursor:pointer;transition:.3s;}
  .notif-filter-btn.active{background:var(--gold);color:#000;border-color:var(--gold);}
  .notif-item{display:flex;align-items:flex-start;gap:16px;padding:20px;background:rgba(255,255,255,.03);border:1px solid var(--border-rgba);border-radius:22px;margin-bottom:12px;cursor:pointer;transition:.3s;position:relative;}
  .notif-item:hover{border-color:var(--gold);background:rgba(197,160,33,.05);}
  .notif-item.unread{border-right:3px solid var(--gold);background:rgba(197,160,33,.04);}
  .notif-item.unread::before{content:'';position:absolute;top:18px;right:-1px;width:8px;height:8px;background:var(--gold);border-radius:50%;}
  .notif-icon{width:48px;height:48px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:1.4rem;flex-shrink:0;}
  .notif-icon.type-booking{background:rgba(59,130,246,.1);color:#60a5fa;}
  .notif-icon.type-wallet{background:rgba(16,185,129,.1);color:#10b981;}
  .notif-icon.type-alert{background:rgba(239,68,68,.1);color:#f87171;}
  .notif-icon.type-system{background:rgba(197,160,33,.1);color:var(--gold);}
  .notif-icon.type-doctor{background:rgba(139,92,246,.1);color:#a78bfa;}
  .notif-body{flex:1;}
  .notif-body h4{font-weight:900;font-size:.95rem;color:white;margin:0 0 4px;}
  .notif-body p{font-size:.8rem;color:var(--text-muted);font-weight:700;margin:0 0 6px;line-height:1.5;}
  .notif-time{font-size:.68rem;color:rgba(148,163,184,.6);font-weight:700;}
  .notif-badge{position:absolute;top:-5px;left:-5px;background:#ef4444;color:white;border-radius:50%;width:18px;height:18px;font-size:.6rem;font-weight:900;display:flex;align-items:center;justify-content:center;}
  .empty-notif{text-align:center;padding:80px 20px;}
  .empty-notif .icon{font-size:4rem;margin-bottom:20px;opacity:.3;}
  .unread-count{background:var(--gold);color:#000;border-radius:50px;padding:3px 12px;font-size:.72rem;font-weight:900;}
  .clear-all-btn{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2);color:#f87171;padding:8px 18px;border-radius:14px;font-size:.8rem;font-weight:800;cursor:pointer;transition:.3s;}
  .clear-all-btn:hover{background:rgba(239,68,68,.2);}
  .date-separator{text-align:center;margin:20px 0 15px;position:relative;}
  .date-separator::before{content:'';position:absolute;top:50%;left:0;right:0;height:1px;background:var(--border-rgba);}
  .date-separator span{position:relative;background:var(--bg-dark);padding:0 15px;font-size:.72rem;color:var(--text-muted);font-weight:800;}
</style>
</head>
<body>

<script src="js/security.js"></script>
<script src="js/firebase-config.js"></script>

<nav class="glass-nav">
  <a href="dashboard.html" class="logo-container">
    <div class="logo-box"><img src="assets/logo.png" alt="معاملاتي"></div>
    <div>
      <div style="font-weight:950;font-size:19px;color:white;">معاملاتي</div>
      <div style="font-size:9px;color:var(--gold);font-weight:800;letter-spacing:1px;">NOTIFICATIONS CENTER</div>
    </div>
  </a>
  <div id="nav-right" style="display:flex;align-items:center;gap:15px;"></div>
</nav>

<div class="container" style="padding-top:30px;max-width:800px;">

  <div class="notif-header">
    <div>
      <h1 style="font-weight:950;font-size:2rem;margin:0;">مركز الإشعارات 🔔</h1>
      <p style="color:var(--text-muted);font-weight:700;font-size:.88rem;margin:6px 0 0;">
        جميع تنبيهاتك في مكان واحد
        <span class="unread-count" id="unread-counter" style="display:none;">0</span>
      </p>
    </div>
    <button onclick="markAllRead()" class="clear-all-btn">
      <i class="fas fa-check-double"></i> تحديد الكل كمقروء
    </button>
  </div>

  <!-- Filters -->
  <div class="notif-filters">
    <button class="notif-filter-btn active" onclick="filterNotifs('ALL',this)">🔔 الكل</button>
    <button class="notif-filter-btn" onclick="filterNotifs('booking',this)">🩺 الحجوزات</button>
    <button class="notif-filter-btn" onclick="filterNotifs('wallet',this)">💰 المحفظة</button>
    <button class="notif-filter-btn" onclick="filterNotifs('doctor',this)">👨‍⚕️ الأطباء</button>
    <button class="notif-filter-btn" onclick="filterNotifs('alert',this)">🚨 التنبيهات</button>
    <button class="notif-filter-btn" onclick="filterNotifs('system',this)">⚙️ النظام</button>
  </div>

  <!-- List -->
  <div id="notif-list">
    <div class="empty-notif">
      <div class="icon">🔔</div>
      <h3 style="font-weight:950;color:white;margin-bottom:10px;">جاري التحميل...</h3>
    </div>
  </div>

</div>

<script src="js/config.js"></script>
<script src="js/email-auth.js"></script>
<script src="js/auth.js"></script>
<script src="js/notifications.js"></script>
<script>
let allNotifs = [];
let currentType = 'ALL';

// Built-in demo notifications that merge with Firebase ones
const DEMO_NOTIFS = [
  { id:'n1', type:'system', title:'مرحباً بك في معاملاتي 👑', body:'تم إنشاء حسابك بنجاح. استمتع بتجربة الخدمات الرقمية المتكاملة.', time: Date.now() - 86400000 * 2, read:true },
  { id:'n2', type:'wallet', title:'تم تفعيل المحفظة الذكية 💳', body:'محفظتك جاهزة للاستخدام. يمكنك الآن تعبئة رصيدك وإجراء التحويلات بأمان.', time: Date.now() - 86400000, read:true },
];

document.addEventListener('DOMContentLoaded', async () => {
  if (!Store.user) { window.location.href = 'login.html'; return; }
  await loadNotifications();
});

async function loadNotifications() {
  try {
    // Load from Firebase
    if (typeof firebaseDB !== 'undefined') {
      const snap = await firebaseDB.ref(`notifications/${Store.user.phone?.replace(/\+/g,'_') || Store.user.id}`).once('value');
      if (snap.exists()) {
        const data = snap.val();
        allNotifs = Object.entries(data).map(([k,v]) => ({id:k,...v}));
      }
    }
    // Merge demo
    const seen = new Set(allNotifs.map(n=>n.id));
    DEMO_NOTIFS.forEach(d => { if(!seen.has(d.id)) allNotifs.push(d); });
    allNotifs.sort((a,b) => (b.time||0) - (a.time||0));
  } catch(e) {
    allNotifs = [...DEMO_NOTIFS];
  }
  updateCounter();
  renderNotifs();
}

function updateCounter() {
  const unread = allNotifs.filter(n => !n.read).length;
  const el = document.getElementById('unread-counter');
  if (unread > 0) { el.style.display='inline'; el.textContent=unread; }
  else el.style.display='none';
}

function filterNotifs(type, btn) {
  currentType = type;
  document.querySelectorAll('.notif-filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderNotifs();
}

function renderNotifs() {
  const list = currentType === 'ALL' ? allNotifs : allNotifs.filter(n => n.type === currentType);
  const container = document.getElementById('notif-list');
  if (list.length === 0) {
    container.innerHTML = `
      <div class="empty-notif">
        <div class="icon">📭</div>
        <h3 style="font-weight:950;color:white;margin-bottom:10px;">لا يوجد إشعارات</h3>
        <p style="color:var(--text-muted);font-weight:700;">لا توجد إشعارات في هذه الفئة حالياً</p>
      </div>`;
    return;
  }

  let html = '';
  let lastDate = '';
  list.forEach(n => {
    const d = new Date(n.time || Date.now()).toLocaleDateString('ar-SY');
    if (d !== lastDate) {
      html += `<div class="date-separator"><span>${d}</span></div>`;
      lastDate = d;
    }
    html += `
      <div class="notif-item ${n.read ? '' : 'unread'}" onclick="markRead('${n.id}', this)">
        <div class="notif-icon type-${n.type || 'system'}">${getIcon(n.type)}</div>
        <div class="notif-body">
          <h4>${n.title || 'إشعار'}</h4>
          <p>${n.body || n.message || ''}</p>
          <span class="notif-time">${timeAgo(n.time)}</span>
        </div>
        ${n.link ? `<a href="${n.link}" style="color:var(--gold);font-size:.75rem;font-weight:900;white-space:nowrap;">عرض <i class="fas fa-chevron-left"></i></a>` : ''}
      </div>`;
  });
  container.innerHTML = html;
}

function getIcon(type) {
  return {booking:'🩺',wallet:'💰',alert:'🚨',system:'⚙️',doctor:'👨‍⚕️'}[type] || '🔔';
}

function timeAgo(ts) {
  if (!ts) return '';
  const diff = Date.now() - ts;
  const m = Math.floor(diff/60000), h = Math.floor(diff/3600000), d = Math.floor(diff/86400000);
  if (d > 0) return `منذ ${d} يوم`;
  if (h > 0) return `منذ ${h} ساعة`;
  if (m > 0) return `منذ ${m} دقيقة`;
  return 'الآن';
}

async function markRead(id, el) {
  el.classList.remove('unread');
  const n = allNotifs.find(n => n.id === id);
  if (n) n.read = true;
  updateCounter();
  try {
    if (typeof firebaseDB !== 'undefined') {
      await firebaseDB.ref(`notifications/${Store.user.phone?.replace(/\+/g,'_') || Store.user.id}/${id}/read`).set(true);
    }
  } catch(e) {}
}

async function markAllRead() {
  allNotifs.forEach(n => n.read = true);
  updateCounter();
  renderNotifs();
  try {
    if (typeof firebaseDB !== 'undefined') {
      const updates = {};
      allNotifs.forEach(n => {
        updates[`notifications/${Store.user.phone?.replace(/\+/g,'_') || Store.user.id}/${n.id}/read`] = true;
      });
      await firebaseDB.ref().update(updates);
    }
  } catch(e) {}
  if (typeof Notify !== 'undefined') Notify.show('تم', 'تم تحديد جميع الإشعارات كمقروءة', 'fas fa-check-double');
}
</script>
</body>
</html>
